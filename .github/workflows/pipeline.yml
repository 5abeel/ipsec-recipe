name: "IPsec Recipe Build Check"

on:
  push:
    branches:
      - main
      - add_pipeline

  pull_request:
    branches:
      - main
      - add_pipeline

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build_ipsec_recipe:
    runs-on: [self-hosted, ipsec-runner]

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ipsec-recipe
        run: |
          source env_setup_acc.sh
          ./install_dep_packages_acc.sh
          
          cd ipsec_offload_plugin
          git clone https://github.com/strongswan/strongswan.git
          cd strongswan/
          git checkout tags/5.9.3 -b 5.9.3
          cd -

          sudo -E ./swanbuild_p4.sh -t native -o $DEPS_INSTALL --enable_grpc

