name: "IPsec-Recipe build verification"

on:
  push:
    branches:
      - main
      - add_pipeline

  pull_request:
    branches:
      - main
      - add_pipeline

concurrency:
  # If workflow is currently running, stop it and start a new one.
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_ipsec_recipe:
    runs-on: [self-hosted, ipsec-recipe]

    steps:
      - name: Clone ipsec-recipe repository
        uses: actions/checkout@v3

      - name: Clone ipsec-recipe and build dependencies
        run: |
          git clone https://github.com/5abeel/ipsec-recipe.git
          cd ipsec-recipe
          source env_setup_acc.sh
          ./install_dep_packages_acc.sh

      - name: Clone strongSwan and checkout version 5.9.3
        working-directory: ipsec-recipe
        run: |
          cd ipsec_offload_plugin/
          git clone https://github.com/strongswan/strongswan.git
          cd strongswan/
          git checkout tags/5.9.3 -b 5.9.3
          cd -

      - name: Build strongSwan with swanbuild_p4.sh
        working-directory: ipsec-recipe
        run: |
          cd ipsec_offload_plugin/
          ./swanbuild_p4.sh -t native -o $DEPS_INSTALL --enable_grpc
